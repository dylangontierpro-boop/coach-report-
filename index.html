<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reborn Prep GLP-1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4ff; color: #1a1a1a; min-height: 100vh; }

    .header { background: linear-gradient(135deg, #001a5c 0%, #013088 100%); padding: 18px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .brand-sub { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 1px; }
    .brand-accent { color: #fe8000; }
    .header-badge { background: #fe8000; color: #fff; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; }

    .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 3rem; }

    .selector-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .select-wrap { flex: 1; position: relative; }
    .select-wrap select { width: 100%; padding: 11px 36px 11px 14px; border-radius: 12px; border: 2px solid #013088; background: #fff; color: #1a1a1a; font-size: 14px; font-weight: 500; font-family: inherit; appearance: none; cursor: pointer; }
    .select-wrap select:focus { outline: none; border-color: #fe8000; }
    .select-arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 12px; color: #013088; }
    .btn-new { padding: 11px 16px; border-radius: 12px; background: #fe8000; color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-new:hover { background: #d96d00; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 20px; padding: 24px; width: 320px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #013088; }
    .modal input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 2px solid #ddd; font-size: 15px; margin-bottom: 12px; font-family: inherit; }
    .modal input:focus { outline: none; border-color: #013088; }
    .modal-btns { display: flex; gap: 8px; }
    .btn-modal { padding: 11px 18px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-confirm { background: #013088; color: #fff; flex: 1; }
    .btn-cancel { background: #f0f0f0; color: #555; }

    .card { background: #fff; border-radius: 16px; border: 1px solid #e0e8ff; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(1,48,136,.05); }
    .card-title { font-size: 11px; font-weight: 700; color: #013088; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }

    .saisie-grid { display: flex; gap: 8px; align-items: flex-end; }
    .inp-wrap { flex: 1; }
    .inp-lbl { font-size: 11px; color: #888; margin-bottom: 4px; font-weight: 500; }
    .inp { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #ddd; font-size: 15px; font-family: inherit; }
    .inp:focus { outline: none; border-color: #013088; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .btn-add { padding: 10px 18px; border-radius: 10px; background: #013088; color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end; }
    .btn-add:hover { background: #001a5c; }

    .periods { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .period-btn { padding: 5px 13px; border-radius: 20px; font-size: 12px; border: 1.5px solid #c5d4f5; background: #fff; cursor: pointer; font-weight: 600; color: #013088; }
    .period-btn.active { background: #013088; color: #fff; border-color: #013088; }

    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: #f0f4ff; border-radius: 10px; padding: 10px 6px; text-align: center; }
    .stat-val { font-size: 16px; font-weight: 800; color: #013088; }
    .stat-val.up { color: #e24b4a; }
    .stat-val.down { color: #1d9e75; }
    .stat-lbl { font-size: 10px; color: #888; margin-top: 2px; font-weight: 500; }

    .chart-wrap { position: relative; height: 200px; }

    .log { max-height: 200px; overflow-y: auto; }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f4ff; }
    .log-item:last-child { border-bottom: none; }
    .log-date { font-size: 13px; color: #555; }
    .log-right { display: flex; align-items: center; gap: 10px; }
    .log-val { font-size: 14px; font-weight: 700; color: #013088; }
    .log-del { background: none; border: none; cursor: pointer; color: #ddd; font-size: 18px; padding: 0; line-height: 1; }
    .log-del:hover { color: #e24b4a; }
    .btn-danger { background: none; border: 1.5px solid #fca5a5; color: #e24b4a; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn-danger:hover { background: #fff5f5; }

    .empty { text-align: center; padding: 2rem 0; color: #aaa; font-size: 14px; }
    .no-client { text-align: center; padding: 3rem 1rem; }
    .no-client p { font-size: 16px; color: #013088; font-weight: 600; margin-bottom: 6px; }
    .no-client span { font-size: 13px; color: #aaa; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="brand-title">REBORN PREP <span class="brand-accent">GLP-1</span></div>
    <div class="brand-sub">by Dylan</div>
  </div>
  <div class="header-badge">Weight Tracker</div>
</div>

<div class="app">
  <div class="selector-row">
    <div class="select-wrap">
      <select id="clientSelect" onchange="selectClient(this.value)">
        <option value="">— Sélectionner un client —</option>
      </select>
      <span class="select-arrow">▾</span>
    </div>
    <button class="btn-new" onclick="openModal()">+ Nouveau</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Nouveau client</h2>
      <input type="text" id="newClientInput" placeholder="Prénom..." maxlength="30" />
      <div class="modal-btns">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-modal btn-confirm" onclick="addClient()">Créer</button>
      </div>
    </div>
  </div>

  <div id="main"></div>
</div>

<script>
const KEY = "wt_v2";
let data = load();
let currentClient = null;
let period = 30;
let chart = null;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {clients:{}}; } catch(e) { return {clients:{}}; } }
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function todayStr() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(str) { return new Date(str+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"}); }
function fmtShort(str) { return new Date(str+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}); }

function openModal() { document.getElementById("overlay").classList.add("open"); setTimeout(()=>document.getElementById("newClientInput").focus(),100); }
function closeModal() { document.getElementById("overlay").classList.remove("open"); document.getElementById("newClientInput").value=""; }

function refreshSelect() {
  const sel = document.getElementById("clientSelect");
  const names = Object.keys(data.clients).sort();
  sel.innerHTML = '<option value="">— Sélectionner un client —</option>' +
    names.map(n=>`<option value="${n}"${n===currentClient?" selected":""}>${n}</option>`).join("");
}

function addClient() {
  const name = document.getElementById("newClientInput").value.trim();
  if (!name) return;
  if (!data.clients[name]) data.clients[name] = [];
  save(); closeModal(); currentClient = name; refreshSelect(); renderMain();
}

function selectClient(name) { currentClient = name || null; renderMain(); }

function deleteClient() {
  if (!currentClient || !confirm("Supprimer "+currentClient+" et toutes ses données ?")) return;
  delete data.clients[currentClient];
  currentClient = Object.keys(data.clients)[0] || null;
  save(); refreshSelect(); renderMain();
}

function addWeight() {
  if (!currentClient) return;
  const inp = document.getElementById("weightInp");
  const dateInp = document.getElementById("dateInp");
  const val = parseFloat((inp.value||"").replace(",","."));
  if (isNaN(val) || val <= 0) return;
  const date = dateInp.value || todayStr();
  const entries = data.clients[currentClient];
  const idx = entries.findIndex(e=>e.d===date);
  if (idx >= 0) entries[idx].w = val;
  else entries.push({d:date, w:val});
  entries.sort((a,b)=>a.d>b.d?1:-1);
  inp.value = "";
  save(); renderChart(); renderLog(); renderStats();
}

function deleteEntry(date) {
  data.clients[currentClient] = data.clients[currentClient].filter(e=>e.d!==date);
  save(); renderChart(); renderLog(); renderStats();
}

function setPeriod(p) {
  period = p;
  document.querySelectorAll(".period-btn").forEach(b=>b.classList.toggle("active",parseInt(b.dataset.p)===p));
  renderChart(); renderStats();
}

function getFiltered() {
  if (!currentClient || !data.clients[currentClient]) return [];
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-period+1); cutoff.setHours(0,0,0,0);
  return data.clients[currentClient].filter(e=>new Date(e.d+"T12:00:00")>=cutoff);
}

function renderStats() {
  const el = document.getElementById("statsZone"); if (!el) return;
  const f = getFiltered();
  if (f.length < 2) { el.innerHTML=""; return; }
  const first=f[0].w, last=f[f.length-1].w, diff=last-first;
  const min=Math.min(...f.map(e=>e.w)), max=Math.max(...f.map(e=>e.w));
  const avg=(f.reduce((s,e)=>s+e.w,0)/f.length).toFixed(1);
  const cls=diff>0?"up":diff<0?"down":"", sign=diff>=0?"+":"";
  el.innerHTML=`<div class="stats">
    <div class="stat"><div class="stat-val ${cls}">${sign}${diff.toFixed(1)}</div><div class="stat-lbl">Évolution</div></div>
    <div class="stat"><div class="stat-val">${avg}</div><div class="stat-lbl">Moyenne</div></div>
    <div class="stat"><div class="stat-val">${min}</div><div class="stat-lbl">Min</div></div>
    <div class="stat"><div class="stat-val">${max}</div><div class="stat-lbl">Max</div></div>
  </div>`;
}

function renderChart() {
  const wrap = document.getElementById("chartWrap"); if (!wrap) return;
  const f = getFiltered();
  if (chart) { chart.destroy(); chart = null; }
  if (!f.length) { wrap.innerHTML="<div class='empty'>Aucune donnée sur cette période</div>"; return; }
  wrap.innerHTML="<canvas id='myChart'></canvas>";
  const ctx = document.getElementById("myChart").getContext("2d");
  const weights = f.map(e=>e.w);
  const minW=Math.min(...weights), maxW=Math.max(...weights);
  const pad=Math.max((maxW-minW)*0.4, 0.5);
  chart = new Chart(ctx, {
    type:"line",
    data:{
      labels:f.map(e=>fmtShort(e.d)),
      datasets:[{
        data:weights,
        borderColor:"#013088",
        backgroundColor:"rgba(1,48,136,0.07)",
        borderWidth:2.5,
        pointRadius:f.length>20?2:5,
        pointBackgroundColor:"#fe8000",
        pointBorderColor:"#fff",
        pointBorderWidth:2,
        tension:0.35,
        fill:true
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#013088",
          titleColor:"rgba(255,255,255,0.7)",
          bodyColor:"#fff",
          bodyFont:{size:14,weight:"bold"},
          padding:10,
          callbacks:{
            label:ctx=>ctx.parsed.y+" kg",
            title:items=>fmtDate(f[items[0].dataIndex].d)
          }
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:11},color:"#aaa",maxRotation:0,autoSkip:true,maxTicksLimit:7}},
        y:{min:minW-pad,max:maxW+pad,grid:{color:"#f0f4ff"},ticks:{font:{size:11},color:"#aaa",callback:v=>v.toFixed(1)+" kg"}}
      }
    }
  });
}

function renderLog() {
  const el = document.getElementById("logZone"); if (!el||!currentClient) return;
  const entries = [...(data.clients[currentClient]||[])].reverse();
  if (!entries.length) { el.innerHTML="<div class='empty'>Aucune entrée</div>"; return; }
  el.innerHTML=entries.map(e=>`
    <div class="log-item">
      <span class="log-date">${fmtDate(e.d)}</span>
      <div class="log-right">
        <span class="log-val">${e.w} kg</span>
        <button class="log-del" onclick="deleteEntry('${e.d}')">×</button>
      </div>
    </div>`).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (!currentClient) {
    main.innerHTML=`<div class="no-client"><p>Aucun client sélectionné</p><span>Créez ou sélectionnez un client</span></div>`;
    return;
  }
  main.innerHTML=`
    <div class="card">
      <div class="card-title">Saisie du poids</div>
      <div class="saisie-grid">
        <div class="inp-wrap"><div class="inp-lbl">Date</div><input type="date" id="dateInp" value="${todayStr()}" class="inp" /></div>
        <div class="inp-wrap"><div class="inp-lbl">Poids (kg)</div><input type="number" id="weightInp" placeholder="78.5" step="0.1" class="inp" onkeydown="if(event.key==='Enter')addWeight()" /></div>
        <button class="btn-add" onclick="addWeight()">+</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Évolution du poids</div>
      <div class="periods">
        ${[7,14,30,60,90].map(p=>`<button class="period-btn${p===period?" active":""}" data-p="${p}" onclick="setPeriod(${p})">${p}j</button>`).join("")}
      </div>
      <div id="statsZone"></div>
      <div class="chart-wrap" id="chartWrap"><canvas id="myChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Historique</div>
      <div class="log" id="logZone"></div>
      <button class="btn-danger" onclick="deleteClient()">Supprimer ce client</button>
    </div>`;

  renderStats(); renderChart(); renderLog();
}

refreshSelect();
const clients = Object.keys(data.clients);
if (clients.length) { currentClient = clients[0]; document.getElementById("clientSelect").value = currentClient; }
renderMain();

document.getElementById("newClientInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addClient(); });
document.getElementById("overlay").addEventListener("click", e=>{ if(e.target===document.getElementById("overlay")) closeModal(); });
</script>
</body>
</html>
